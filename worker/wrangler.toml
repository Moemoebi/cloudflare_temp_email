name = "cloudflare-temp-email"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = [ "nodejs_compat" ]
keep_vars = true

[assets]
directory = "../frontend/dist/"
binding = "ASSETS"
run_worker_first = true

[vars]
PREFIX = ""
DOMAINS = ["nethanie.my.id"]
DEFAULT_DOMAINS = ["nethanie.my.id"]
JWT_SECRET = "rahasia-nethanie-2026-aman-sekali"
ENABLE_USER_CREATE_EMAIL = true
ENABLE_USER_DELETE_EMAIL = true
ENABLE_AUTO_REPLY = false

[[d1_databases]]
binding = "DB"
database_name = "tempmail-db"
database_id = "c4f2141c-f0e5-4725-9934-055082616739"
